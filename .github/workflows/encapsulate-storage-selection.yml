name: Encapsulate storage selection state

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  encapsulate-storage-selection:
    if: github.head_ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube

      - name: Encapsulate selected storage state
        run: |
          unexpected="$(grep -RIl '\bselected_storage\b' src include | grep -vE '^(src/main.c|src/storage.c|include/storage.h)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected selected_storage users:"
            echo "$unexpected"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('include/storage.h')
          text = path.read_text()
          old = '''/*
           * Transitional state exported during the first 0.4 modularization pass.
           * Keeping these names preserves call-site behaviour while code moves out of
           * main.c. A later Michishirube step can encapsulate selection behind accessors
           * once the split itself has regression coverage.
           */
          extern const storage_target_t storage_targets[STORAGE_TARGET_COUNT];
          extern unsigned int selected_storage;

          '''
          new = '''/* Storage target metadata remains read-only to callers. */
          extern const storage_target_t storage_targets[STORAGE_TARGET_COUNT];

          /* Selected-target state is owned by storage.c. */
          unsigned int storage_selected(void);
          int storage_set_selected(unsigned int storage);

          '''
          text = replace_once(text, old, new, 'storage header state')
          path.write_text(text)

          path = Path('src/storage.c')
          text = path.read_text()
          text = replace_once(text,
              'unsigned int selected_storage = 0;\n\n'
              '/* Construct a root-level path for one supported storage device. */\n',
              'static unsigned int selected_storage = 0;\n\n'
              'unsigned int storage_selected(void)\n'
              '{\n'
              '    return selected_storage;\n'
              '}\n\n'
              'int storage_set_selected(unsigned int storage)\n'
              '{\n'
              '    if (storage >= STORAGE_TARGET_COUNT)\n'
              '        return -1;\n'
              '    selected_storage = storage;\n'
              '    return 0;\n'
              '}\n\n'
              '/* Construct a root-level path for one supported storage device. */\n',
              'storage accessors')
          text = replace_once(text,
              '        selected_storage = 2;\n        return;\n',
              '        storage_set_selected(2);\n        return;\n',
              'mass0 launch selection')
          text = replace_once(text,
              '            selected_storage = i;\n            return;\n',
              '            storage_set_selected(i);\n            return;\n',
              'normal launch selection')
          path.write_text(text)

          path = Path('src/main.c')
          text = path.read_text()
          text = replace_once(text,
              '            selected_storage = choice;\n',
              '            storage_set_selected(choice);\n',
              'manual storage assignment')
          text = text.replace('selected_storage', 'storage_selected()')
          if 'selected_storage' in text:
              raise SystemExit('selected_storage remained in main.c')
          path.write_text(text)
          PY

      - name: Update documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'docs/ARCHITECTURE.md',
              '- `src/storage.c` — storage target definitions, launch-device selection, ROMVER access, and generic fileXio helpers. The first split temporarily exposes the selected target state so call sites remain behaviorally identical; later Michishirube work will encapsulate it after regression coverage exists.\n',
              '- `src/storage.c` — storage target definitions, encapsulated selected-target state, launch-device selection, ROMVER access, and generic fileXio helpers. Callers read/change the selection through validated accessors instead of mutating module state directly.\n',
              'architecture storage ownership')

          replace_once(
              'docs/ROADMAP.md',
              '- [x] `storage` first pass — storage targets, launch-device selection, ROMVER/file helpers, exact/bounded reads, and generic writes.\n- [ ] Encapsulate storage selection state after the mechanical split has hardware coverage.\n',
              '- [x] `storage` — storage targets, encapsulated selected-target state, launch-device selection, ROMVER/file helpers, exact/bounded reads, and generic writes.\n',
              'roadmap storage state')

          replace_once(
              'CHANGELOG.md',
              '- Extracted storage-target selection, ROMVER access, and generic fileXio helpers into `storage.c` / `storage.h` while temporarily preserving the existing selected-storage state interface.\n',
              '- Extracted storage-target selection, ROMVER access, and generic fileXio helpers into `storage.c` / `storage.h`; Michishirube now also encapsulates the selected-target state behind `storage_selected()` / `storage_set_selected()` instead of exporting a mutable global.\n',
              'changelog storage state')
          PY

      - name: Verify state boundary and run host tests
        run: |
          ! grep -q 'extern unsigned int selected_storage' include/storage.h
          ! grep -q '\bselected_storage\b' src/main.c
          grep -q 'static unsigned int selected_storage' src/storage.c
          grep -q 'storage_set_selected' src/main.c
          make test-host

      - name: Cross-build integrated R5900 ELF
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Commit verified encapsulation and remove workflow
        run: |
          rm .github/workflows/encapsulate-storage-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- include/storage.h src/storage.c src/main.c CHANGELOG.md \
            docs/ARCHITECTURE.md docs/ROADMAP.md \
            .github/workflows/encapsulate-storage-selection.yml
          git commit -m "Encapsulate storage selection state"
          git push origin HEAD:dev/0.4.0-michishirube
