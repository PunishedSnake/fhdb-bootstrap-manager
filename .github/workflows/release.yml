name: Publish versioned release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define APP_VERSION "\([^"]*\)"/\1/p' include/version.h)"
          codename="$(sed -n 's/^#define APP_CODENAME "\([^"]*\)"/\1/p' include/version.h)"
          test -n "$version"
          test -n "$codename"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "codename=$codename" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.zip"
          if assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if grep -Fqx "$bundle" <<<"$assets"; then
              echo "bundle_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run portable tests
        if: steps.existing.outputs.bundle_exists != 'true'
        run: make test-host

      - name: Build release ELF
        if: steps.existing.outputs.bundle_exists != 'true'
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Package release assets
        if: steps.existing.outputs.bundle_exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mv PS2_HDD_BOOTSTRAP_MANAGER.ELF "PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.ELF"
          test -f HDDMAN.CFG
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f PS2SDK_LICENSE.txt
          test -f third_party/spleen/LICENSE
          sha256sum "PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.ELF" \
            HDDMAN.CFG LICENSE THIRD_PARTY_NOTICES.md PS2SDK_LICENSE.txt \
            third_party/spleen/LICENSE \
            > SHA256SUMS.txt
          zip -9 "PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.zip" \
            "PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.ELF" HDDMAN.CFG \
            SHA256SUMS.txt LICENSE THIRD_PARTY_NOTICES.md PS2SDK_LICENSE.txt \
            third_party/spleen/LICENSE

      - name: Publish stable GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CODENAME: ${{ steps.version.outputs.codename }}
        run: |
          gh release create "$TAG" \
            "PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.ELF" \
            "PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.zip" \
            SHA256SUMS.txt HDDMAN.CFG \
            --target "$GITHUB_SHA" \
            --title "PS2 HDD Bootstrap Manager ${VERSION} — ${CODENAME}" \
            --notes-file RELEASE_NOTES.md

      - name: Add missing bundle to existing release
        if: steps.existing.outputs.exists == 'true' && steps.existing.outputs.bundle_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "PS2_HDD_BOOTSTRAP_MANAGER-${VERSION}.zip"
          gh release edit "$TAG" --notes-file RELEASE_NOTES.md
