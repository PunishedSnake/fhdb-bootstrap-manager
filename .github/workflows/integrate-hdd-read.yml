name: Integrate read-only HDD acquisition

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate-hdd-read:
    if: github.head_ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube

      - name: Replace monolithic raw-read and payload acquisition code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.c')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          def replace_regex(pattern, new, label):
              global text
              text, count = re.subn(pattern, new, text, count=1,
                                    flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')

          replace_once(
              '#include "boot_chain_ps2.h"\n#include "boot_report.h"\n',
              '#include "boot_chain_ps2.h"\n#include "boot_payload_ps2.h"\n#include "boot_report.h"\n',
              'boot payload include')
          replace_once(
              '#include "capsule_format.h"\n#include "kelf.h"\n',
              '#include "capsule_format.h"\n#include "hdd_limits.h"\n#include "hdd_read.h"\n#include "kelf.h"\n',
              'HDD read includes')
          replace_once(
              '#define MBR_PAYLOAD_START 0x2000\n'
              '#define SECTOR_SIZE 512\n'
              '#define TRANSFER_SECTORS 2\n'
              '#define TRANSFER_BYTES (SECTOR_SIZE * TRANSFER_SECTORS)\n'
              '#define MAX_MBR_PAYLOAD_SIZE (4 * 1024 * 1024)\n',
              '#define MBR_PAYLOAD_START HDD_MBR_PAYLOAD_START\n'
              '#define SECTOR_SIZE HDD_SECTOR_SIZE\n'
              '#define TRANSFER_SECTORS HDD_TRANSFER_SECTORS\n'
              '#define TRANSFER_BYTES HDD_TRANSFER_BYTES\n'
              '#define MAX_MBR_PAYLOAD_SIZE HDD_MAX_MBR_PAYLOAD_SIZE\n',
              'shared HDD limits')
          replace_once('#define HDIOC_READSECTOR_LOCAL 0x6836\n', '',
                       'local raw-read ioctl')
          replace_once(
              '/* Argument layout used by the raw read devctl. */\n'
              'typedef struct {\n'
              '    u32 lba;\n'
              '    u32 size;\n'
              '} raw_transfer_t;\n\n',
              '',
              'raw transfer struct')

          replace_regex(
              r'/\* Read sectors 0 and 1, which contain the complete APA master header\. \*/\n'
              r'static int read_header\(unsigned char \*destination\)\n\{.*?\n\}\n',
              '/* Read sectors 0 and 1 through the shared read-only transport. */\n'
              'static int read_header(unsigned char *destination)\n'
              '{\n'
              '    return hdd_read_raw_sectors(0, 2, destination);\n'
              '}\n',
              'read_header')
          replace_regex(
              r'/\* Read a small raw sector range for post-write payload verification\. \*/.*?'
              r'(?=/\* Update only osdStart/osdSize through ps2hdd and flush its APA cache\. \*/)',
              '',
              'raw read helpers')
          text = text.replace('result = read_raw_sectors(',
                              'result = hdd_read_raw_sectors(')

          replace_regex(
              r'/\* Read the active payload, fingerprint it, and collect downstream evidence\. \*/\n'
              r'static void analyze_boot_chain\(boot_chain_info_t \*info\)\n\{.*?\n\}\n'
              r'(?=/\* Refresh the in-memory evidence and optionally persist both report and log\. \*/)',
              '/* Collect active-payload and downstream evidence, then classify it. */\n'
              'static void analyze_boot_chain(boot_chain_info_t *info)\n'
              '{\n'
              '    u32 start = read_le32(header_buffer + APA_OSD_START_OFFSET);\n'
              '    u32 sectors = read_le32(header_buffer + APA_OSD_SIZE_OFFSET);\n'
              '\n'
              '    memset(info, 0, sizeof(*info));\n'
              '    info->skip_hdd[0] = -1;\n'
              '    info->skip_hdd[1] = -1;\n'
              '    info->skip_hdd[2] = -1;\n'
              '    read_romver(info->romver);\n'
              '    expected_system_folder(info->romver, info->expected_system_folder,\n'
              '                           sizeof(info->expected_system_folder));\n'
              '    scan_active_payload_evidence(info, start, sectors);\n'
              '    scan_skip_hdd_settings(info);\n'
              '    scan_memory_card_boot_files(info);\n'
              '    scan_sysconf_partition(info);\n'
              '    scan_system_partition(info);\n'
              '    classify_boot_chain(info, start, sectors);\n'
              '}\n',
              'boot-chain analyzer')

          replace_once(
              '    u32 sectors = read_le32(header_buffer + APA_OSD_SIZE_OFFSET);\n'
              '    iox_stat_t mbr_status;\n'
              '    int result;\n',
              '    u32 sectors = read_le32(header_buffer + APA_OSD_SIZE_OFFSET);\n'
              '    int result;\n',
              'rescue local mbr status')
          replace_once('result = validate_payload_bounds(start, sectors, &mbr_status);',
                       'result = hdd_validate_payload_bounds(start, sectors);',
                       'rescue bounds call')
          text = text.replace('read_payload_image(start, sectors,',
                              'hdd_read_payload_image(start, sectors,')

          literal_leftovers = [
              'static int read_raw_sectors(',
              'static int validate_payload_bounds(',
              'static int read_payload_image(',
              'HDIOC_READSECTOR_LOCAL',
              'raw_transfer_t'
          ]
          for token in literal_leftovers:
              if token in text:
                  raise SystemExit(f'leftover monolithic token: {token}')
          if re.search(r'(?<!hdd_)validate_payload_bounds\(', text):
              raise SystemExit('leftover unqualified validate_payload_bounds call')
          if re.search(r'(?<!hdd_)read_payload_image\(', text):
              raise SystemExit('leftover unqualified read_payload_image call')
          if re.search(r'(?<!hdd_)read_raw_sectors\(', text):
              raise SystemExit('leftover unqualified read_raw_sectors call')

          path.write_text(text)
          PY

      - name: Run full portable regression suite
        run: make test-host

      - name: Cross-build integrated R5900 ELF
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Commit verified integration and remove migration workflow
        run: |
          rm .github/workflows/integrate-hdd-read.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.c .github/workflows/integrate-hdd-read.yml
          git commit -m "Integrate read-only HDD payload acquisition"
          git push origin HEAD:dev/0.4.0-michishirube
