name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable tests
        run: make test-host

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stripped PS2 ELF with PS2DEV v2.0.0
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'
      - name: Record artifact checksum
        run: sha256sum PS2_HDD_BOOTSTRAP_MANAGER.ELF | tee PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PS2-HDD-Bootstrap-Manager
          path: |
            PS2_HDD_BOOTSTRAP_MANAGER.ELF
            PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256

  integrate-bootstrap-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube
          fetch-depth: 0

      - name: Route install preparation through bootstrap source module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.c')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once('#include "bootstrap_transaction_ps2.h"\n',
                       '#include "bootstrap_source.h"\n#include "bootstrap_transaction_ps2.h"\n',
                       'bootstrap source include')

          start = text.index('/* Load a bounded MBR.XIN/MBR.XLF source; USB receives a short mount grace period. */')
          end = text.index('/* Select mc0, mc1, or mass without changing anything until X confirms. */', start)
          if 'static int load_payload_file' not in text[start:end]:
              raise SystemExit('install source loader block missing')
          text = text[:start] + text[end:]

          start = text.index('/* Sign, write, verify, and finally enable a stock MBR.XLF payload. */')
          end = text.index('/* ------------------------------------------------------------------------- */\n/* Main state machine', start)
          new_install = '''/* Sign, write, verify, and finally enable a prepared stock MBR payload. */
          static void install_bootstrap(void)
          {
              bootstrap_source_t source;
              bootstrap_source_result_t source_result;
              const char *backup_path;
              const char *installed_rescue;
              int signing_port;
              bootstrap_transaction_result_t transaction;
              int result;

              if (read_le32(header_buffer + APA_OSD_START_OFFSET) != 0 ||
                  read_le32(header_buffer + APA_OSD_SIZE_OFFSET) != 0) {
                  scr_clear();
                  scr_printf("Disable the current bootstrap before installing.\\n");
                  wait_to_return();
                  return;
              }

              bootstrap_source_init(&source, storage_selected());
              scr_clear();
              scr_printf("Loading %s\\n", source.path);
              if (storage_selected() == 2)
                  scr_printf("Waiting briefly for USB if necessary...\\n");

              result = bootstrap_source_prepare(storage_selected(), &source,
                                                &source_result);
              if (result < 0) {
                  if (source_result.stage == BOOTSTRAP_SOURCE_STAGE_LOAD) {
                      session_log_line("MBR.XLF load failed from %s: %d",
                                       source.path, source_result.code);
                      session_log_flush(storage_selected());
                      scr_clear();
                      scr_printf("Could not load %s\\nCode: %d\\n",
                                 source.path, source_result.code);
                      wait_to_return();
                      return;
                  }
                  if (source_result.stage == BOOTSTRAP_SOURCE_STAGE_KELF) {
                      session_log_line("MBR.XLF structural validation failed: %d",
                                       source_result.code);
                      session_log_flush(storage_selected());
                      scr_clear();
                      scr_printf("MBR.XLF is not a structurally valid KELF.\\n");
                      scr_printf("Validation code: %d\\n", source_result.code);
                      wait_to_return();
                      return;
                  }

                  session_log_line(
                      "MBR.XLF capacity validation failed: getstat=%d, start=0x%08x, "
                      "size=0x%08x, sectors=%u",
                      source_result.getstat_result, source_result.mbr_start,
                      source_result.mbr_size, source_result.payload_sectors);
                  session_log_flush(storage_selected());
                  scr_clear();
                  scr_printf("The __mbr reserved payload area is not valid.\\n");
                  scr_printf("getstat:%d start:0x%08x size:0x%08x\\n",
                             source_result.getstat_result,
                             source_result.mbr_start, source_result.mbr_size);
                  wait_to_return();
                  return;
              }

              backup_path = save_backup();
              if (backup_path == NULL) {
                  bootstrap_source_release(&source);
                  backup_error_screen();
                  return;
              }

              signing_port = storage_targets[storage_selected()].memory_card_port;
              if (signing_port < 0)
                  signing_port = choose_signing_card();
              if (signing_port < 0) {
                  bootstrap_source_release(&source);
                  return;
              }

              scr_clear();
              scr_printf("Signing MBR.XLF through mc%d...\\n", signing_port);
              if (SecrDownloadFile(2 + signing_port, 0, source.payload) == NULL) {
                  bootstrap_source_release(&source);
                  session_log_line("MagicGate signing failed through mc%d", signing_port);
                  session_log_flush(storage_selected());
                  scr_clear();
                  scr_printf("MagicGate signing failed through mc%d.\\n", signing_port);
                  scr_printf("HDD was NOT modified. Check the PS2 memory card.\\n");
                  wait_to_return();
                  return;
              }
              result = kelf_validate_layout(source.payload, source.payload_size);
              if (result < 0) {
                  bootstrap_source_release(&source);
                  fatal_screen("Signed KELF failed structural validation.", result);
              }

              scr_clear();
              scr_printf("Ready to install signed HDD bootstrap\\n\\n");
              scr_printf("Source : %s\\n", source.path);
              scr_printf("Backup : %s\\n", backup_path);
              scr_printf("Target : sector 0x%08x\\n", MBR_PAYLOAD_START);
              scr_printf("Size   : %u bytes / 0x%x sectors\\n\\n",
                         source.payload_size, source.sectors);
              scr_printf("This installs only the MBR bootstrap program.\\n");
              scr_printf("It does not create FHDB/HDD-OSD partitions.\\n\\n");
              scr_printf("Hold L1+R1 and press CIRCLE to confirm.\\n");
              scr_printf("Press TRIANGLE to cancel.\\n");
              if (!wait_for_chord(PAD_L1 | PAD_R1 | PAD_CIRCLE)) {
                  bootstrap_source_release(&source);
                  return;
              }

              scr_clear();
              scr_printf("Writing and verifying signed payload...\\n");
              result = bootstrap_transaction_ps2_activate(
                  header_buffer, source.payload, source.payload_size,
                  MBR_PAYLOAD_START, source.sectors, free, source.payload,
                  &transaction);
              source.payload = NULL;
              if (result < 0) {
                  if (transaction.stage == BOOTSTRAP_TRANSACTION_STAGE_PAYLOAD)
                      fatal_screen(
                          "Payload write/read-back failed; pointer remains disabled.",
                          result);
                  else if (transaction.stage ==
                           BOOTSTRAP_TRANSACTION_STAGE_POINTER_SET)
                      fatal_screen(
                          "Payload verified, but enabling its pointer failed.", result);
                  else
                      fatal_screen("Installed pointer verification failed.", result);
              }

              session_log_line(
                  "Bootstrap installed and verified at sector 0x%08x (%u bytes, "
                  "%u sectors)", MBR_PAYLOAD_START, source.payload_size,
                  source.sectors);
              refresh_boot_chain_report(1);
              installed_rescue = save_rescue_capsule();
              session_log_flush(storage_selected());

              scr_clear();
              scr_printf("Bootstrap installed, enabled, and verified.\\n\\n");
              scr_printf("The payload is signed for this console.\\n");
              scr_printf("Rescue: %s\\n",
                         installed_rescue != NULL ? installed_rescue : "not available");
              scr_printf("Remember: its expected partitions must also exist.\\n");
              wait_to_return();
          }

          '''
          text = text[:start] + new_install + text[end:]

          for old in (
              '#define SECTOR_SIZE HDD_SECTOR_SIZE\n',
              '#define TRANSFER_SECTORS HDD_TRANSFER_SECTORS\n',
              '#define TRANSFER_BYTES HDD_TRANSFER_BYTES\n',
              '#define MAX_MBR_PAYLOAD_SIZE HDD_MAX_MBR_PAYLOAD_SIZE\n'
          ):
              if old in text:
                  text = text.replace(old, '', 1)

          if 'DelayThread(' not in text:
              text = text.replace('#include <delaythread.h>\n', '', 1)
          if 'iox_stat_t' not in text and 'FIO_' not in text:
              text = text.replace('#include <io_common.h>\n', '', 1)

          forbidden = (
              'load_payload_file(', 'fileXioGetStat("hdd0:__mbr"',
              'MAX_MBR_PAYLOAD_SIZE', 'TRANSFER_SECTORS', 'TRANSFER_BYTES',
              'SECTOR_SIZE'
          )
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'legacy install preparation remained: {token}')
          for required in ('bootstrap_source_init', 'bootstrap_source_prepare',
                           'bootstrap_source_release'):
              if required not in text:
                  raise SystemExit(f'missing bootstrap source call: {required}')

          path.write_text(text)
          PY

      - name: Verify source boundary and regressions
        run: |
          ! grep -q 'load_payload_file\|fileXioGetStat("hdd0:__mbr"' src/main.c
          ! grep -q 'SecrDownloadFile\|wait_for_chord\|bootstrap_transaction\|HDIOC_WRITESECTOR\|HDIOC_SETOSDMBR\|scr_printf\|session_log' src/bootstrap_source.c
          grep -q 'bootstrap_source_prepare' src/main.c
          grep -q 'SecrDownloadFile' src/main.c
          grep -q 'bootstrap_transaction_ps2_activate' src/main.c
          make test-host
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0 \
            sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Commit integrated source preparation and restore normal CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/main.c
          git commit -m "Extract bootstrap source preparation"
          git checkout 4320b53a90cdffe145baf3bb005763c397ea07a5 -- .github/workflows/ci.yml
          git add -- .github/workflows/ci.yml
          git commit -m "Restore normal CI after source extraction"
          git push origin HEAD:dev/0.4.0-michishirube
