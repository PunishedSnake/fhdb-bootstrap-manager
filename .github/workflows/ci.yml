name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  extract-boot-chain-core:
    if: github.head_ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube
          fetch-depth: 0

      - name: Move tested boot-chain core out of main.c
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.c')
          text = path.read_text()

          if '#include "boot_chain.h"' not in text:
              anchor = '#include "apa.h"\n'
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + '#include "boot_chain.h"\n', 1)

          marker = '/* Evidence collected without modifying either the HDD or memory cards. */'
          model_end = 'static boot_chain_info_t boot_chain;'
          assert text.count(marker) == 1
          start = text.index(marker)
          end = text.index(model_end, start) + len(model_end)
          text = (text[:start] +
                  '/* Read-only evidence is modeled in boot_chain.h. */\n' +
                  model_end + text[end:])

          def function_span(source, name):
              pattern = re.compile(
                  r'\nstatic\s+[^;{]+?\b' + re.escape(name) +
                  r'\s*\([^;]*?\)\s*\{', re.S)
              match = pattern.search(source)
              assert match is not None, f'missing function {name}'
              brace = source.index('{', match.start())
              depth = 0
              i = brace
              state = 'code'
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if ch == '/' and nxt == '*':
                          state = 'block'; i += 2; continue
                      if ch == '/' and nxt == '/':
                          state = 'line'; i += 2; continue
                      if ch == '"':
                          state = 'string'; i += 1; continue
                      if ch == "'":
                          state = 'char'; i += 1; continue
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return match.start() + 1, i + 1
                  elif state == 'block':
                      if ch == '*' and nxt == '/':
                          state = 'code'; i += 2; continue
                  elif state == 'line':
                      if ch == '\n': state = 'code'
                  elif state in ('string', 'char'):
                      if ch == '\\':
                          i += 2; continue
                      if (state == 'string' and ch == '"') or (
                              state == 'char' and ch == "'"):
                          state = 'code'
                  i += 1
              raise AssertionError(f'unclosed function {name}')

          def remove_function(source, name):
              a, b = function_span(source, name)
              return source[:a] + source[b:]

          def replace_function(source, name, replacement):
              a, b = function_span(source, name)
              return source[:a] + replacement + source[b:]

          read_skip = r'''static int read_skip_hdd_setting(const char *path)
          {
              char *text = malloc(TEXT_FILE_LIMIT);
              int attempts = (selected_storage == 2 &&
                              strncmp(path, "mass:", 5) == 0) ? 20 : 1;
              int result;

              if (text == NULL)
                  return -2;
              do {
                  result = read_text_file(path, text, TEXT_FILE_LIMIT);
                  if (result >= 0)
                      break;
                  DelayThread(250000);
              } while (--attempts > 0);
              if (result < 0) {
                  free(text);
                  return -1;
              }
              result = parse_skip_hdd_text(text);
              free(text);
              return result;
          }'''

          text = replace_function(text, 'read_skip_hdd_setting', read_skip)
          for name in ('ascii_equal_nocase', 'config_value',
                       'expected_system_folder', 'classify_boot_chain'):
              text = remove_function(text, name)

          assert 'typedef struct {\n    char romver[RESCUE_CAPSULE_ROMVER_SIZE];' not in text
          assert 'static int config_value(' not in text
          assert 'static void classify_boot_chain(' not in text
          assert 'parse_skip_hdd_text(text)' in text
          assert '#include "boot_chain.h"' in text
          path.write_text(text)
          PY

      - name: Run portable regression suite
        run: make test-host

      - name: Cross-build refactored R5900 ELF
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Commit verified extraction and restore normal CI
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            host-tests:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Run portable tests
                  run: make test-host

            ps2-build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Build stripped PS2 ELF with PS2DEV v2.0.0
                  run: >-
                    docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
                    sh -c 'apk add --no-cache make >/dev/null && make clean && make release'
                - name: Record artifact checksum
                  run: sha256sum PS2_HDD_BOOTSTRAP_MANAGER.ELF | tee PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256
                - uses: actions/upload-artifact@v4
                  with:
                    name: PS2-HDD-Bootstrap-Manager
                    path: |
                      PS2_HDD_BOOTSTRAP_MANAGER.ELF
                      PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.c .github/workflows/ci.yml
          git commit -m 'Extract portable boot-chain core from main'
          git push origin HEAD:dev/0.4.0-michishirube
