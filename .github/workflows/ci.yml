name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable tests
        run: make test-host
      - name: Self-test guarded hardware fault injector
        run: python3 tools/hardware_fault_injector.py selftest
      - name: Self-test HDL performance log parser
        run: python3 tools/parse_hdl_perf.py --selftest
      - name: Enforce direct-fileXio runtime policy
        run: |
          python3 tools/check_filexio_fdman_policy.py --selftest
          python3 tools/check_filexio_fdman_policy.py
      - name: Enforce no-local-time libcglue policy
        run: |
          python3 tools/check_libcglue_time_policy.py --selftest
          python3 tools/check_libcglue_time_policy.py
      - name: Enforce integer-only formatter policy
        run: |
          python3 tools/printf_format_audit.py --selftest
          python3 tools/check_integer_format_policy.py --selftest
          python3 tools/check_integer_format_policy.py

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, audit and strip PS2 ELF with PS2DEV v2.0.0
        run: >-
          docker run --rm
          -e PROJECT_GIT_SHA="$GITHUB_SHA"
          -e PROJECT_GIT_REF="$GITHUB_REF"
          -e PS2DEV_BUNDLE_REF="v2.0.0"
          -e PS2SDK_SOURCE_REF="v2.0.0"
          -e PS2SDK_SOURCE_SHA="b12f8af37bd42ec13b1bafb7ab6e7bdcfb4b683b"
          -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make python3 >/dev/null &&
          sh tools/r5900_toolchain_audit.sh GCC_R5900_TARGET.txt &&
          sh tools/build_benchmark_provenance.sh BENCHMARK_PROVENANCE.yml &&
          python3 tools/corpus_v2_project_audit.py
          --output CORPUS_V2_PROJECT_AUDIT.txt &&
          python3 tools/printf_format_audit.py
          --output PRINTF_FORMAT_AUDIT.txt &&
          make clean && make &&
          python3 tools/optimization_audit.py
          --elf PS2_HDD_BOOTSTRAP_MANAGER.ELF
          --output OPTIMIZATION_AUDIT.txt &&
          make release'
      - name: Record artifact checksum
        run: sha256sum PS2_HDD_BOOTSTRAP_MANAGER.ELF | tee PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PS2-HDD-Bootstrap-Manager
          path: |
            PS2_HDD_BOOTSTRAP_MANAGER.ELF
            PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256
            PS2_HDD_BOOTSTRAP_MANAGER.map
            OPTIMIZATION_AUDIT.txt
            CORPUS_V2_PROJECT_AUDIT.txt
            PRINTF_FORMAT_AUDIT.txt
            GCC_R5900_TARGET.txt
            BENCHMARK_PROVENANCE.yml
            HDDMAN.CFG
            LICENSE
            THIRD_PARTY_NOTICES.md
            PS2SDK_LICENSE.txt
            third_party/spleen/LICENSE
            third_party/open-ps2-loader/NOTICE
