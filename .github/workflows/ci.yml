name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable tests
        run: make test-host

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stripped PS2 ELF with PS2DEV v2.0.0
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'
      - name: Record artifact checksum
        run: sha256sum PS2_HDD_BOOTSTRAP_MANAGER.ELF | tee PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PS2-HDD-Bootstrap-Manager
          path: |
            PS2_HDD_BOOTSTRAP_MANAGER.ELF
            PS2_HDD_BOOTSTRAP_MANAGER.ELF.sha256

  integrate-boot-report:
    if: github.event.pull_request.head.ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube
          fetch-depth: 0

      - name: Replace monolithic report renderer with portable module
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/main.c')
          text = path.read_text()

          include_anchor = '#include "boot_chain_ps2.h"\n'
          assert text.count(include_anchor) == 1
          text = text.replace(include_anchor,
                              include_anchor + '#include "boot_report.h"\n', 1)

          size_define = '#define BOOT_REPORT_SIZE 16384\n'
          assert text.count(size_define) == 1
          text = text.replace(size_define, '', 1)

          start_marker = ('/* Render all direct observations and clearly label '
                          'heuristic inferences. */\n'
                          'static void render_boot_chain_report')
          end_marker = ('/* Refresh the in-memory evidence and optionally persist '
                        'both report and log. */')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]

          old_call = ('    analyze_boot_chain(&boot_chain);\n'
                      '    render_boot_chain_report(&boot_chain);\n')
          assert text.count(old_call) == 1
          new_call = (
              '    analyze_boot_chain(&boot_chain);\n'
              '    boot_report_length = boot_report_render(\n'
              '        boot_report, sizeof(boot_report), &boot_chain,\n'
              '        read_le32(header_buffer + APA_OSD_START_OFFSET),\n'
              '        read_le32(header_buffer + APA_OSD_SIZE_OFFSET),\n'
              '        APP_NAME, APP_VERSION);\n')
          text = text.replace(old_call, new_call, 1)

          path.write_text(text)
          PY

      - name: Run full portable regression suite
        run: make test-host

      - name: Cross-build integrated R5900 ELF
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Restore normal CI and commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f PS2_HDD_BOOTSTRAP_MANAGER.ELF tests/test_formats tests/test_boot_chain tests/test_boot_report tests/test_kelf
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.c .github/workflows/ci.yml
          git commit -m "Extract portable boot-chain report renderer"
          git push origin HEAD:dev/0.4.0-michishirube
