name: Clean up post-extraction comments

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  cleanup-comments:
    if: github.head_ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube

      - name: Remove stale extraction comments
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.c')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '/* Load a bounded MBR.XLF into EE memory; USB receives a short mount grace period. */',
              '/* Load a bounded MBR.XIN/MBR.XLF source; USB receives a short mount grace period. */',
              'payload source comment')
          replace_once(
              '/* USB has no MagicGate hardware, so choose which memory card signs MBR.XLF. */',
              '/* USB has no MagicGate hardware, so choose which memory card signs the bootstrap source. */',
              'signing source comment')

          stale_block = '''/* Map ROMVER's region character to the memory-card system folder family. */


/* Inspect all known regional FMCB folders because cross-model cards can mix them. */


/* Read the three locations from which FMCB configurations are commonly used. */


/* Inspect __sysconf for FHDB and modern OSDMenu configuration evidence. */


/* Inspect __system for the executable that a bootstrap is likely to launch. */


/* Classify the probable family separately from the directly observed evidence. */


'''
          replace_once(
              stale_block,
              '/* Filesystem/config scanners live in boot_chain_ps2.c; main only coordinates them. */\n\n',
              'stale boot-chain comment block')
          replace_once(
              '        result = hdd_read_raw_sectors(start_sector + sector_offset, sectors,\n                                  sector_verify_buffer);',
              '        result = hdd_read_raw_sectors(start_sector + sector_offset, sectors,\n                                      sector_verify_buffer);',
              'read verification indentation')

          path.write_text(text)
          PY

      - name: Run full portable regression suite
        run: make test-host

      - name: Cross-build cleaned R5900 tree
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Commit verified cleanup and remove migration workflow
        run: |
          rm .github/workflows/cleanup-hdd-read-comments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.c .github/workflows/cleanup-hdd-read-comments.yml
          git commit -m "Clean up read-only acquisition comments"
          git push origin HEAD:dev/0.4.0-michishirube
