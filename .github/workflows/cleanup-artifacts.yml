name: Cleanup Actions artifacts

on:
  push:
    paths:
      - ".github/workflows/cleanup-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for sibling workflows, then delete all Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Waiting for other workflow runs on commit $GITHUB_SHA to finish..."
          for attempt in $(seq 1 120); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100"               --jq ".workflow_runs | map(select((.id != ${GITHUB_RUN_ID}) and (.status != \"completed\"))) | length")
            [ "$pending" -eq 0 ] && break
            echo "$pending sibling workflow run(s) still active; waiting..."
            sleep 10
          done

          pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100"             --jq ".workflow_runs | map(select((.id != ${GITHUB_RUN_ID}) and (.status != \"completed\"))) | length")
          if [ "$pending" -ne 0 ]; then
            echo "::error::$pending sibling workflow run(s) did not finish within the wait window."
            exit 1
          fi

          mapfile -t ids < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false) | .id')
          echo "Found ${#ids[@]} active artifact(s)."

          deleted=0
          already_gone=0
          for id in "${ids[@]}"; do
            [ -z "$id" ] && continue
            if gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" 2>/dev/null; then
              deleted=$((deleted + 1))
            else
              already_gone=$((already_gone + 1))
            fi
          done

          echo "Deleted $deleted artifact(s); $already_gone were already gone."

          mapfile -t remaining < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false) | .id')
          echo "Remaining active artifacts: ${#remaining[@]}"
          test "${#remaining[@]}" -eq 0
