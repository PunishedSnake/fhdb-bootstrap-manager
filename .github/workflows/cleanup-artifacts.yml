name: Cleanup Actions artifacts

on:
  push:
    paths:
      - ".github/workflows/cleanup-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          echo "Found ${#ids[@]} artifact(s)."
          deleted=0
          for id in "${ids[@]}"; do
            [ -z "$id" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            deleted=$((deleted + 1))
          done
          echo "Deleted $deleted artifact(s)."
          remaining=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=1" --jq '.total_count')
          echo "Remaining artifacts: $remaining"
          test "$remaining" -eq 0
