name: Integrate boot diagnostics orchestration

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate-boot-diagnostics:
    if: github.head_ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube

      - name: Extract read-only boot diagnostics orchestration
        run: |
          cat > include/boot_diagnostics_ps2.h <<'EOF'
          #ifndef PS2_HDD_BOOTSTRAP_MANAGER_BOOT_DIAGNOSTICS_PS2_H
          #define PS2_HDD_BOOTSTRAP_MANAGER_BOOT_DIAGNOSTICS_PS2_H

          #include "boot_chain.h"

          /*
           * Collect one complete read-only boot-chain evidence snapshot for the
           * supplied APA bootstrap pointer. This boundary performs no rendering,
           * persistence, UI, rescue, signing, or disk-changing operation.
           */
          void boot_diagnostics_scan(boot_chain_info_t *info,
                                     unsigned int start,
                                     unsigned int sectors);

          #endif
          EOF

          cat > src/boot_diagnostics_ps2.c <<'EOF'
          /* PS2-only orchestration of the read-only boot-chain evidence sources. */

          #include <string.h>

          #include "boot_chain.h"
          #include "boot_chain_ps2.h"
          #include "boot_diagnostics_ps2.h"
          #include "boot_payload_ps2.h"
          #include "storage.h"

          void boot_diagnostics_scan(boot_chain_info_t *info,
                                     unsigned int start,
                                     unsigned int sectors)
          {
              if (info == NULL)
                  return;

              memset(info, 0, sizeof(*info));
              info->skip_hdd[0] = -1;
              info->skip_hdd[1] = -1;
              info->skip_hdd[2] = -1;

              read_romver(info->romver);
              expected_system_folder(info->romver, info->expected_system_folder,
                                     sizeof(info->expected_system_folder));
              scan_active_payload_evidence(info, start, sectors);
              scan_skip_hdd_settings(info);
              scan_memory_card_boot_files(info);
              scan_sysconf_partition(info);
              scan_system_partition(info);
              classify_boot_chain(info, start, sectors);
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/main.c')
          text = path.read_text()
          text = replace_once(
              text,
              '#include "boot_chain.h"\n#include "boot_chain_ps2.h"\n#include "boot_payload_ps2.h"\n',
              '#include "boot_chain.h"\n#include "boot_diagnostics_ps2.h"\n',
              'boot diagnostics includes')

          old_block = '''/* Filesystem/config scanners live in boot_chain_ps2.c; main only coordinates them. */

          /* Collect active-payload and downstream evidence, then classify it. */
          static void analyze_boot_chain(boot_chain_info_t *info)
          {
              u32 start = read_le32(header_buffer + APA_OSD_START_OFFSET);
              u32 sectors = read_le32(header_buffer + APA_OSD_SIZE_OFFSET);

              memset(info, 0, sizeof(*info));
              info->skip_hdd[0] = -1;
              info->skip_hdd[1] = -1;
              info->skip_hdd[2] = -1;
              read_romver(info->romver);
              expected_system_folder(info->romver, info->expected_system_folder,
                                     sizeof(info->expected_system_folder));
              scan_active_payload_evidence(info, start, sectors);
              scan_skip_hdd_settings(info);
              scan_memory_card_boot_files(info);
              scan_sysconf_partition(info);
              scan_system_partition(info);
              classify_boot_chain(info, start, sectors);
          }
          /* Refresh the in-memory evidence and optionally persist both report and log. */
          static void refresh_boot_chain_report(int save_to_storage)
          {
              analyze_boot_chain(&boot_chain);
              boot_report_length = boot_report_render(
                  boot_report, sizeof(boot_report), &boot_chain,
                  read_le32(header_buffer + APA_OSD_START_OFFSET),
                  read_le32(header_buffer + APA_OSD_SIZE_OFFSET),
                  APP_NAME, APP_VERSION);
          '''
          new_block = '''/* Refresh the read-only evidence and optionally persist both report and log. */
          static void refresh_boot_chain_report(int save_to_storage)
          {
              u32 start = read_le32(header_buffer + APA_OSD_START_OFFSET);
              u32 sectors = read_le32(header_buffer + APA_OSD_SIZE_OFFSET);

              boot_diagnostics_scan(&boot_chain, start, sectors);
              boot_report_length = boot_report_render(
                  boot_report, sizeof(boot_report), &boot_chain,
                  start, sectors, APP_NAME, APP_VERSION);
          '''
          text = replace_once(text, old_block, new_block, 'boot diagnostics orchestration')

          leftovers = [
              'analyze_boot_chain(',
              'scan_active_payload_evidence(',
              'scan_skip_hdd_settings(',
              'scan_memory_card_boot_files(',
              'scan_sysconf_partition(',
              'scan_system_partition(',
              'classify_boot_chain('
          ]
          for token in leftovers:
              if token in text:
                  raise SystemExit(f'read-only orchestration remained in main.c: {token}')
          path.write_text(text)

          path = Path('Makefile')
          text = path.read_text()
          text = replace_once(
              text,
              'EE_OBJS = main.o platform.o storage.o apa.o hdd_read.o boot_chain.o boot_chain_ps2.o boot_payload.o boot_payload_ps2.o boot_report.o boot_report_ps2.o session_log.o kelf.o sha256.o capsule_format.o mbr_compat.o',
              'EE_OBJS = main.o platform.o storage.o apa.o hdd_read.o boot_chain.o boot_chain_ps2.o boot_payload.o boot_payload_ps2.o boot_diagnostics_ps2.o boot_report.o boot_report_ps2.o session_log.o kelf.o sha256.o capsule_format.o mbr_compat.o',
              'EE objects')
          text = replace_once(
              text,
              'boot_payload_ps2.o: src/boot_payload_ps2.c\n\t$(EE_CC) $(EE_CFLAGS) $(EE_INCS) -c $< -o $@\n\n'
              'boot_report.o: src/boot_report.c\n',
              'boot_payload_ps2.o: src/boot_payload_ps2.c\n\t$(EE_CC) $(EE_CFLAGS) $(EE_INCS) -c $< -o $@\n\n'
              'boot_diagnostics_ps2.o: src/boot_diagnostics_ps2.c\n\t$(EE_CC) $(EE_CFLAGS) $(EE_INCS) -c $< -o $@\n\n'
              'boot_report.o: src/boot_report.c\n',
              'boot diagnostics object rule')
          path.write_text(text)
          PY

      - name: Update documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'README.md',
              '`boot_report_ps2.c` owns `BOOTCHAIN.TXT` persistence and `session_log.c` owns bounded `HDDMAN.LOG` buffering, rotation, and flush policy. `main.c` still owns diagnostics orchestration/UI, rescue/install policy, MagicGate signing, and every write-capable APA operation.',
              '`boot_diagnostics_ps2.c` now orchestrates the complete read-only evidence scan; `boot_report_ps2.c` owns `BOOTCHAIN.TXT` persistence and `session_log.c` owns bounded `HDDMAN.LOG` buffering, rotation, and flush policy. `main.c` retains diagnostics presentation/timing, rescue/install policy, MagicGate signing, and every write-capable APA operation.',
              'README diagnostics boundary')

          replace_once(
              'docs/ARCHITECTURE.md',
              '- `src/main.c` — application state machine, diagnostics orchestration/UI, rescue/install workflows, write-capable APA transport, and guarded pointer/write ordering that has not yet been extracted.\n',
              '- `src/main.c` — application state machine, diagnostics presentation/timing, rescue/install workflows, write-capable APA transport, and guarded pointer/write ordering that has not yet been extracted.\n',
              'architecture main ownership')
          replace_once(
              'docs/ARCHITECTURE.md',
              '- `src/boot_chain_ps2.c` — PS2-only but read-only evidence collection from memory cards and PFS partitions. It owns no raw HDD write or pointer update.\n',
              '- `src/boot_chain_ps2.c` — PS2-only but read-only evidence collection from memory cards and PFS partitions. It owns no raw HDD write or pointer update.\n'
              '- `src/boot_diagnostics_ps2.c` — PS2-only orchestration that initializes one evidence snapshot, combines ROMVER/filesystem/raw-payload sources, and invokes portable classification. It performs no rendering, persistence, UI, or disk-changing operation.\n',
              'architecture diagnostics module')
          replace_once(
              'docs/ARCHITECTURE.md',
              '3. `main.c` combines those evidence sources and calls `classify_boot_chain()`; it no longer owns the raw active-payload read loop or payload fingerprinting implementation.\n'
              '4. `boot_report.c` receives the completed `boot_chain_info_t` plus explicit `osdStart`/`osdSize` values and renders the bounded text image.\n'
              '5. `boot_report_ps2.c` persists that already-rendered image as `BOOTCHAIN.TXT`; `session_log.c` owns ordered `HDDMAN.LOG` buffering, append/rotation, and storage retry policy. `main.c` retains only orchestration, the last report-save result used by the UI, and the short diagnostics screen.\n',
              '3. `boot_diagnostics_ps2.c` initializes and combines those evidence sources, then invokes portable `classify_boot_chain()`; `main.c` no longer contains evidence-collection orchestration.\n'
              '4. `boot_report.c` receives the completed `boot_chain_info_t` plus explicit `osdStart`/`osdSize` values and renders the bounded text image.\n'
              '5. `boot_report_ps2.c` persists that already-rendered image as `BOOTCHAIN.TXT`; `session_log.c` owns ordered `HDDMAN.LOG` buffering, append/rotation, and storage retry policy. `main.c` retains scan timing/presentation, the last report-save result used by the UI, and the short diagnostics screen.\n',
              'architecture report pipeline')

          replace_once(
              'docs/ROADMAP.md',
              '- [ ] `boot_chain` orchestration/UI — `main.c` still combines evidence, decides when to render/persist, retains the last report-save result for display, and owns the short diagnostics screen.\n',
              '- [x] `boot_diagnostics_ps2` orchestration — ROMVER initialization, active-payload evidence, FMCB/PFS evidence collection, and final family classification are combined outside `main.c` behind a read-only PS2-specific entry point.\n'
              '- [ ] diagnostics presentation/UI — `main.c` still decides when to scan/render/persist, retains the last report-save result for display, and owns the short diagnostics screen.\n',
              'roadmap diagnostics orchestration')
          replace_once(
              'docs/ROADMAP.md',
              '- reduce the remaining diagnostics orchestration/UI state without moving classification policy or storage operations back into `main.c`;\n',
              '- reduce the remaining diagnostics presentation/UI state without moving classification policy, evidence acquisition, or storage operations back into `main.c`;\n',
              'roadmap remaining diagnostics')

          replace_once(
              'CHANGELOG.md',
              '- Kept only report/log orchestration, the last report-save result used by the diagnostics UI, and the short diagnostics screen in `main.c`.\n',
              '- Extracted complete read-only evidence-scan orchestration into `boot_diagnostics_ps2.c` / `boot_diagnostics_ps2.h`; `main.c` no longer initializes/scans/classifies boot-chain evidence itself.\n'
              '- Kept only diagnostics timing/presentation, the last report-save result used by the UI, and the short diagnostics screen in `main.c`.\n',
              'changelog diagnostics orchestration')
          PY

      - name: Verify read-only boundary and run host tests
        run: |
          ! grep -q 'fileXioDevctl\|HDIOC_WRITE\|HDIOC_SETOSDMBR\|SecrDownloadFile' src/boot_diagnostics_ps2.c
          ! grep -q 'scan_active_payload_evidence\|scan_sysconf_partition\|classify_boot_chain' src/main.c
          make test-host

      - name: Cross-build integrated R5900 ELF
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Commit verified extraction and remove workflow
        run: |
          rm .github/workflows/integrate-boot-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- include/boot_diagnostics_ps2.h src/boot_diagnostics_ps2.c src/main.c \
            Makefile README.md CHANGELOG.md docs/ARCHITECTURE.md docs/ROADMAP.md \
            .github/workflows/integrate-boot-diagnostics.yml
          git commit -m "Extract read-only boot diagnostics orchestration"
          git push origin HEAD:dev/0.4.0-michishirube
