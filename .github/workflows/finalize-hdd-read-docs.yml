name: Finalize read-only HDD boundary docs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize-hdd-read-docs:
    if: github.head_ref == 'dev/0.4.0-michishirube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.4.0-michishirube

      - name: Update documentation for extracted read-only acquisition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'README.md',
              'Keep irreplaceable data copied elsewhere.\n\n## Features\n',
              'Keep irreplaceable data copied elsewhere.\n\n'
              '## Development branch\n\n'
              'The active `dev/0.4.0-michishirube` branch is refactoring internals behind regression-gated module boundaries without changing Torii\'s write transaction. Read-only raw HDD acquisition now lives in `hdd_read.c`; payload/KELF fingerprinting is split between portable `boot_payload.c` and PS2-specific `boot_payload_ps2.c`. `main.c` still owns report persistence, rescue/install policy, MagicGate signing, and every write-capable APA operation. This work remains development-only until the branch completes its hardware-validation gate.\n\n'
              '## Features\n',
              'README development status')

          replace_once(
              'docs/ARCHITECTURE.md',
              '- `src/main.c` — application state machine, raw active-payload acquisition, report persistence/orchestration, rescue/install workflows, logging policy, raw HDD transport, and guarded pointer/write ordering that has not yet been extracted.\n',
              '- `src/main.c` — application state machine, report persistence/orchestration, rescue/install workflows, logging policy, write-capable APA transport, and guarded pointer/write ordering that has not yet been extracted.\n',
              'architecture main ownership')
          replace_once(
              'docs/ARCHITECTURE.md',
              '- `src/apa.c` — portable, read-only APA master-header core: little-endian parsing, checksum, normal `__mbr` validation, hybrid-GPT detection, and same-disk identity comparison.\n',
              '- `src/apa.c` — portable, read-only APA master-header core: little-endian parsing, checksum, normal `__mbr` validation, hybrid-GPT detection, and same-disk identity comparison.\n'
              '- `src/hdd_read.c` — PS2-only read-only raw HDD transport: bounded `HDIOC_READSECTOR` access, live `hdd0:__mbr` capacity checks, and sector-aligned active-payload acquisition. It exposes no write or pointer-update operation.\n'
              '- `src/boot_payload.c` — PS2SDK-free conversion of a sector-aligned active payload into byte counts, sector-image SHA-256, KELF structural result/size, and unpadded-KELF SHA-256.\n'
              '- `src/boot_payload_ps2.c` — narrow PS2 acquisition adapter that combines `hdd_read` with portable `boot_payload` fingerprinting and fills only payload-derived boot-chain evidence.\n',
              'architecture extracted modules')
          replace_once(
              'docs/ARCHITECTURE.md',
              'The following operations still belong to the not-yet-extracted transport half in `main.c`:\n\n- `HDIOC_READSECTOR` / `HDIOC_WRITESECTOR` RPC packets and aligned transfer buffers;\n- active-payload bounds checks against the actual `hdd0:__mbr` partition;\n- `HDIOC_SETOSDMBR` pointer changes and flushes;\n- post-write sector comparison and final header read-back.\n\nKeeping that boundary explicit prevents a testable parser extraction from accidentally becoming an unreviewed rewrite of the write path.\n',
              'Read-only `HDIOC_READSECTOR` transport and active-payload bounds checks now live in `hdd_read.c`. The module uses its own aligned two-sector read buffer and can only return bytes or validation errors; it cannot flush, write sectors, or update `osdStart`/`osdSize`.\n\nThe following operations deliberately remain in the not-yet-extracted write-capable half in `main.c`:\n\n- `HDIOC_WRITESECTOR` packets and the aligned write/verification buffers used by install/restore;\n- `HDIOC_SETOSDMBR` pointer changes and write-cache flushes;\n- post-write sector comparison and final APA-header read-back;\n- rescue/install transaction ordering, including payload-first/pointer-last activation.\n\nKeeping the read boundary separate from the write transaction lets diagnostics reuse one raw-read implementation without turning a parser refactor into an unreviewed rewrite of disk-changing behavior.\n',
              'architecture APA boundary')
          replace_once(
              'docs/ARCHITECTURE.md',
              'Boot-chain diagnostics now have three explicit layers instead of one function that both understood evidence and owned output state:\n\n1. `boot_chain.c` and `boot_chain_ps2.c` define/collect the evidence that can be obtained without raw write access.\n2. `main.c` still acquires and fingerprints the active raw HDD payload because that operation crosses the not-yet-extracted APA transport boundary.\n3. `boot_report.c` receives the completed `boot_chain_info_t` plus explicit `osdStart`/`osdSize` values and renders the bounded text image. `main.c` remains responsible for saving that image as `BOOTCHAIN.TXT`, appending the save result to `HDDMAN.LOG`, and presenting the short UI summary.\n',
              'Boot-chain diagnostics now have explicit acquisition, policy, rendering, and persistence layers instead of one function that understood every device and output detail:\n\n1. `boot_chain.c` and `boot_chain_ps2.c` define the evidence model, portable classification policy, and filesystem/configuration evidence that does not require raw HDD writes.\n2. `boot_payload_ps2.c` acquires the active sector image through read-only `hdd_read.c`; portable `boot_payload.c` performs hashing and KELF-size/structure conversion.\n3. `main.c` combines those evidence sources and calls `classify_boot_chain()`; it no longer owns the raw active-payload read loop or payload fingerprinting implementation.\n4. `boot_report.c` receives the completed `boot_chain_info_t` plus explicit `osdStart`/`osdSize` values and renders the bounded text image. `main.c` remains responsible for saving that image as `BOOTCHAIN.TXT`, appending the save result to `HDDMAN.LOG`, and presenting the short UI summary.\n',
              'architecture report boundary')

          replace_once(
              'docs/BOOT_REPORT.md',
              '1. **Evidence acquisition** — `boot_chain_ps2.c` reads FMCB configuration, memory-card modules, `__sysconf`, `__system`, and related filesystem evidence. `main.c` still acquires the active raw payload and its hashes because that crosses the raw-HDD transport boundary.\n',
              '1. **Evidence acquisition** — `boot_chain_ps2.c` reads FMCB configuration, memory-card modules, `__sysconf`, `__system`, and related filesystem evidence. `boot_payload_ps2.c` acquires the active raw payload through read-only `hdd_read.c`, while portable `boot_payload.c` computes the sector-image/KELF fingerprints and KELF result fields. `main.c` only orchestrates these completed evidence sources.\n',
              'boot report acquisition ownership')

          replace_once(
              'CHANGELOG.md',
              '- Extracted bounded `BOOTCHAIN.TXT` formatting into PS2SDK-free `boot_report.c` / `boot_report.h`. The renderer consumes an already-completed evidence snapshot and has no fileXio, PFS, memory-card, logging, or raw-HDD side effects.\n- Kept report persistence and the short diagnostics UI in `main.c`; only presentation formatting moved, so existing save/log behavior remains outside the portable layer.\n',
              '- Extracted bounded `BOOTCHAIN.TXT` formatting into PS2SDK-free `boot_report.c` / `boot_report.h`. The renderer consumes an already-completed evidence snapshot and has no fileXio, PFS, memory-card, logging, or raw-HDD side effects.\n'
              '- Extracted read-only `HDIOC_READSECTOR` transport, live `hdd0:__mbr` payload bounds checks, and sector-aligned active-payload reads into PS2-only `hdd_read.c` / `hdd_read.h`.\n'
              '- Extracted payload hashing and KELF-size/structure conversion into portable `boot_payload.c` / `boot_payload.h`, with `boot_payload_ps2.c` / `boot_payload_ps2.h` providing the narrow PS2 acquisition adapter.\n'
              '- `analyze_boot_chain()` now delegates active-payload evidence acquisition instead of owning raw sector loops and fingerprinting directly.\n'
              '- Kept report persistence and the short diagnostics UI in `main.c`; existing save/log behavior remains outside the portable layer.\n',
              'changelog extraction entries')
          replace_once(
              'CHANGELOG.md',
              '- Added a byte-for-byte golden `BOOTCHAIN.TXT` fixture for a disabled bootstrap plus active-payload/hash, OSDMenu/module-evidence, assessment-precedence, and bounded-truncation fixtures.\n',
              '- Added a byte-for-byte golden `BOOTCHAIN.TXT` fixture for a disabled bootstrap plus active-payload/hash, OSDMenu/module-evidence, assessment-precedence, and bounded-truncation fixtures.\n'
              '- Added portable `boot_payload` fixtures covering a valid sector-padded KELF, invalid-KELF sector-image hashing, and reset behavior for empty input.\n',
              'changelog payload tests')
          replace_once(
              'CHANGELOG.md',
              '- `HDIOC_READSECTOR`, `HDIOC_WRITESECTOR`, live payload bounds checks, aligned raw-transfer buffers, `HDIOC_SETOSDMBR`, flush/read-back verification, rescue restore, MagicGate signing, and payload-first/pointer-last ordering remain unchanged in `main.c`.\n',
              '- Read-only `HDIOC_READSECTOR`, live payload bounds checks, and active-image acquisition moved behind `hdd_read.c`; the interface exposes no write, flush, or pointer-update operation.\n'
              '- `HDIOC_WRITESECTOR`, `HDIOC_SETOSDMBR`, write/verification buffers, flush/read-back verification, rescue restore, MagicGate signing, and payload-first/pointer-last ordering remain in `main.c` with their Torii semantics unchanged.\n',
              'changelog safety boundary')
          replace_once(
              'CHANGELOG.md',
              '- The new report renderer cannot access storage. `analyze_boot_chain()` still owns raw payload acquisition, while `main.c` still owns `BOOTCHAIN.TXT` persistence, `HDDMAN.LOG` updates, and diagnostics-screen presentation.\n',
              '- The report renderer cannot access storage. Active payload acquisition is now delegated to the read-only `boot_payload_ps2`/`hdd_read` boundary, while `main.c` still owns `BOOTCHAIN.TXT` persistence, `HDDMAN.LOG` updates, diagnostics-screen presentation, and every disk-changing transaction.\n',
              'changelog report safety')
          PY

      - name: Run full portable regression suite
        run: make test-host

      - name: Cross-build documented R5900 tree
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'

      - name: Commit verified documentation and remove migration workflow
        run: |
          rm .github/workflows/finalize-hdd-read-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/ARCHITECTURE.md docs/BOOT_REPORT.md .github/workflows/finalize-hdd-read-docs.yml
          git commit -m "Document read-only HDD payload boundary"
          git push origin HEAD:dev/0.4.0-michishirube
